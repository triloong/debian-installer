FLAVOUR_SUPPORTED = ""
IMAGE_SIZE = 150000

GZIPPED = .gz
EXTRANAME = hd-media/

CONCATENATEABLE_SUFFIX =

TARGET = $(KERNEL) $(INITRD) $(HD_MEDIA_TAR) hd-media_bootscript hd-media_images_concatenateable

MANIFEST-INITRD = "Initrd for use on USB memory sticks"
MANIFEST-KERNEL = "Kernel for use on USB memory sticks"
MANIFEST-HD_MEDIA_TAR = "Tarball of files for USB memory sticks"

.PHONY: hd-media_bootscript
hd-media_bootscript: $(TEMP)/boot.scr
	cp $< $(SOME_DEST)/$(EXTRANAME)boot.scr
	update-manifest $(SOME_DEST)/$(EXTRANAME)boot.scr "Universal boot script for mainline u-boot (>= v2014.10)"

.PHONY: hd-media_images_concatenateable
hd-media_images_concatenateable: $(TEMP_U_BOOT) $(TEMP_HD_MEDIA_DIR)
	mkdir -p $(SOME_DEST)/$(EXTRANAME)/SD-card-images/$(CONCATENATEABLE_SUFFIX)
	for img in $(TEMP_U_BOOT)/*/*.sdcard.img.gz; do \
		cp "$$img" $(SOME_DEST)/$(EXTRANAME)/SD-card-images/$(CONCATENATEABLE_SUFFIX)/firmware."$$(basename "$$img" .sdcard.img.gz)".img.gz; \
	done
	gen-hd-image -v -z -p 32768 -b firmware -s "$(IMAGE_SIZE)" -o "$(SOME_DEST)/$(EXTRANAME)/SD-card-images/$(CONCATENATEABLE_SUFFIX)/firmware.none.img"
	gen-hd-image -v -z -p 32768 -b partition -s "$(IMAGE_SIZE)" -i "$(TEMP_HD_MEDIA_DIR)" -o "$(SOME_DEST)/$(EXTRANAME)/SD-card-images/$(CONCATENATEABLE_SUFFIX)/partition.img"
	cp boot/README.concatenateable_images "$(SOME_DEST)/$(EXTRANAME)/SD-card-images/$(CONCATENATEABLE_SUFFIX)/"
