MEDIUM_SUPPORTED = hd-media netboot network-console netboot-gtk device-tree u-boot cdrom

KERNELMAJOR = 2.6
# The version of the kernel to use.
KERNELVERSION = $(LINUX_KERNEL_ABI)-armmp
KERNELNAME = vmlinuz

# Configuration for generating EFI images
GRUB_EFI=y
GRUB_EFI_PLATFORM=arm-efi
GRUB_EFI_NAME=arm
# We do *NOT* have support for UEFI Secure Boot on this arch
EFI_SIGNED=n

# We do *NOT* build a gtk installer for this arch
GRAPHICAL_INSTALLER=n

# Default size from gen-hd-image
IMAGE_SIZE = 976560

# Use boot.scr for U-Boot sdcard images
U_BOOT_SCRIPT = y

arch_boot_screens:
arch_tree:

include config/arm.cfg

$(TEMP)/OLPC_XO.boot: boot/arm/olpc.fth
	mkdir -p $(TEMP)/
	dd if=/dev/zero bs=512 seek=1985 count=0 of=$@
	mkfs.msdos -v $@
	mmd -i $@ boot
	mcopy -s -i $@ boot/arm/olpc.fth ::boot

.PHONY: arch_u-boot
arch_u-boot: $(TEMP)/OLPC_XO.boot
	mkdir -p $(TEMP_U_BOOT)/
	set -e; while read LINE; \
	do \
	  if [ -n "$${LINE}" ] && ! echo $${LINE}|grep -q -e "^#"; then \
	    set -- $${LINE}; \
	    mkdir -p "$(TEMP_U_BOOT)/$$1"; \
	    echo "Providing u-boot binaries for $$1 ..."; \
	    [ -f "$$2" ] && pigz -9nm <"$$2" >"$(TEMP_U_BOOT)/$$1/$$(basename $$2).gz"; \
	    [ -f "$$4" ] && pigz -9nm <"$$4" >"$(TEMP_U_BOOT)/$$1/$$(basename $$4).gz"; \
	    gen-hd-image -v -z -p 32768 -b firmware -s "$(IMAGE_SIZE)" -o "$(TEMP_U_BOOT)/$$1/$$1.sdcard.img" \
	        "$$2" "$$3" "$$4" "$$5" ;\
	  fi ;\
	done < boot/arm/u-boot-image-config
	mkdir -p $(TEMP_U_BOOT)/OLPC_XO
	gen-hd-image -v -z -p 32768 -b firmware -d 0x0e -s $(IMAGE_SIZE) -o $(TEMP_U_BOOT)/OLPC_XO/OLPC_XO.sdcard.img \
		$(TEMP)/OLPC_XO.boot 63
