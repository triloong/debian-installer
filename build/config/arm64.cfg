MEDIUM_SUPPORTED = cdrom netboot netboot-gtk device-tree u-boot hd-media

KERNELMAJOR = 2.6
# The version of the kernel to use.
KERNELVERSION = $(LINUX_KERNEL_ABI)-arm64
KERNELNAME = vmlinuz

# Configuration for generating EFI images
GRUB_EFI=y
GRUB_EFI_PLATFORM=arm64-efi
GRUB_EFI_NAME=aa64
# We have support for UEFI Secure Boot on this arch
EFI_SIGNED=y

# We build a gtk installer for this arch
GRAPHICAL_INSTALLER=y

# ChromeOS board codenames to try to build for.
DEPTHCHARGE_BOARDS = arm64-generic

# Default size from gen-hd-image
IMAGE_SIZE = 976560

# Use extlinux.conf for U-Boot sdcard images
U_BOOT_EXTLINUX = y

arch_boot_screens:
arch_tree:

include config/arm.cfg

.PHONY: arch_u-boot
arch_u-boot:
	-rm -f $(TEMP_U_BOOT)/*
	mkdir -p $(TEMP_U_BOOT)
	for target in a64-olinuxino nanopi_neo2 orangepi_one_plus orangepi_zero_plus2 pine64_plus pinebook teres_i ; do \
		echo "Providing u-boot binaries for $$target ..." ; \
		gen-hd-image -v -p 32768 -s "$(IMAGE_SIZE)" -b firmware -o $(TEMP_U_BOOT)/$${target}.img ; \
		TARGET=/usr/lib/u-boot/$${target} u-boot-install-sunxi $(TEMP_U_BOOT)/$${target}.img ; \
		pigz -9nmf $(TEMP_U_BOOT)/$${target}.img ; \
	done
	for target in firefly-rk3399 pinebook-pro-rk3399 rockpro64-rk3399 rock64-rk3328 rock-pi-4-rk3399 ; do \
		echo "Providing u-boot binaries for $$target ..." ; \
		gen-hd-image -v -p 32768 -s "$(IMAGE_SIZE)" -b firmware -o $(TEMP_U_BOOT)/$${target}.img ; \
		TARGET=/usr/lib/u-boot/$${target} u-boot-install-rockchip $(TEMP_U_BOOT)/$${target}.img ; \
		pigz -9nmf $(TEMP_U_BOOT)/$${target}.img ; \
	done
	for target in puma-rk3399 ; do \
		echo "Providing u-boot binaries for $$target ..." ; \
		gen-hd-image -v -p 32768 -s "$(IMAGE_SIZE)" -b firmware -o $(TEMP_U_BOOT)/$${target}.img ; \
		TARGET=/usr/lib/u-boot/$${target} UBOOT_OFFSET=512 u-boot-install-rockchip $(TEMP_U_BOOT)/$${target}.img ; \
		pigz -9nmf $(TEMP_U_BOOT)/$${target}.img ; \
	done

.PHONY: arch_u-boot_media
arch_u-boot_media: $(TEMP_HD_MEDIA_DIR) $(TEMP_U_BOOT)
	mkdir -p $(TEMP_U_BOOT_MEDIA)
	for img in $(TEMP_U_BOOT)/*.img.gz; do \
		cp "$$img" $(TEMP_U_BOOT_MEDIA)/firmware."$$(basename "$$img")"; \
	done
	gen-hd-image -v -z -p 32768 -b firmware -s "$(IMAGE_SIZE)" -o "$(TEMP_U_BOOT_MEDIA)/firmware.none.img"
	gen-hd-image -v -z -p 32768 -b partition -s "$(IMAGE_SIZE)" -i "$(TEMP_HD_MEDIA_DIR)" -o "$(TEMP_U_BOOT_MEDIA)/partition.img"
	cp boot/README.concatenateable_images "$(TEMP_U_BOOT_MEDIA)/"
